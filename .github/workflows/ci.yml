name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ["22", "24"]
        exclude:
          # One Node version is enough off Linux; keeps the matrix cheap.
          - os: windows-latest
            node: "22"
          - os: macos-latest
            node: "22"
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # Bun 1.4.2 comes from devDependencies (`npx bun`), so the test runtime
      # is the exact version pinned in package-lock.json. No setup-bun needed.
      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      # Unit + parity suites. The live e2e suite is opt-in (costs money) and
      # runs in e2e.yml; its offline harness tests run here.
      - name: Unit and parity tests
        run: npx bun test tests/unit tests/parity

      - name: Offline e2e harness tests
        run: npx bun test tests/e2e/harness.test.ts

      - name: Build
        run: npm run build --if-present

      - name: Pack (dry run)
        run: npm pack --dry-run
