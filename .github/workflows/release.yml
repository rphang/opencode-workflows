name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # create the GitHub Release
      id-token: write # npm trusted publishing (OIDC) + provenance
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24" # ships npm >= 11.5.1, required for trusted publishing
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Check tag matches package.json version
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "VERSION=$PKG_VERSION" >> "$GITHUB_ENV"

      - name: Extract release notes from CHANGELOG.md
        run: |
          # Body of the "## [x.y.z]" section, up to the next "## [" heading.
          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { found = 1; next }
            found && index($0, "## [") == 1 { exit }
            found && /^\[[^]]+\]: / { next }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if ! grep -q '[^[:space:]]' RELEASE_NOTES.md; then
            echo "::error::No '## [$VERSION]' section in CHANGELOG.md"
            exit 1
          fi
          cat RELEASE_NOTES.md

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit and parity tests
        run: npx bun test tests/unit tests/parity

      - name: Build
        run: npm run build --if-present

      - name: Pack (dry run)
        run: npm pack --dry-run

      # Trusted publishing: npm verifies this repo + workflow through GitHub's OIDC token, so no
      # NPM_TOKEN secret exists. Configure it once on npmjs.com: package settings > Trusted Publisher >
      # GitHub Actions (owner rphang, repository opencode-workflows, workflow release.yml).
      # A version that is already on npm (e.g. published by hand) is skipped so the Release still gets created.
      - name: Publish to npm
        run: |
          if npm view "$(node -p "require('./package.json').name")@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::$VERSION is already on npm; skipping publish"
          else
            npm publish --provenance --access public
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          prerelease: ${{ contains(github.ref_name, '-') }}
